<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaeri Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* ── EXACT ORIGINAL ADMIN STYLES ── */
    :root { --bg-primary: #0d1b2a; --bg-secondary: #1b263b; --text-primary: #e0e6ed; --accent-teal: #72efdd; --action-blue: #007bff; --border-color: #3e506e; --success: #28a745; --error: #dc3545; }
    body { background-color: var(--bg-primary); color: var(--text-primary); font-family: 'Roboto', sans-serif; margin: 0; }
    .header { background-color: var(--bg-secondary); padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { font-weight: 700; color: var(--accent-teal); font-size: 1.1rem; }
    .refresh-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .refresh-btn:hover { border-color: var(--accent-teal); color: var(--accent-teal); }
    .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { background-color: var(--bg-secondary); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: var(--action-blue); }
    .proof-img { width: 100%; height: 150px; object-fit: cover; background-color: #000; cursor: zoom-in; }
    .card-body { padding: 15px; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--accent-teal); margin: 0 0 10px 0; }
    .info-row { font-size: 0.9rem; margin-bottom: 6px; color: #b0b8c3; }
    .info-label { color: var(--action-blue); font-weight: 500; margin-right: 5px; }
    .actions { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color); }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; color: white; transition: 0.2s; }
    .btn-approve { background-color: var(--success); }
    .btn-approve:hover { background-color: #218838; }
    .btn-reject { background-color: var(--error); }
    .btn-reject:hover { background-color: #c82333; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    .skeleton-card { height: 320px; background: var(--bg-secondary); border-radius: 12px; padding: 15px; border: 1px solid var(--border-color); }
    .sk-img { height: 150px; background: #2a3a4a; margin-bottom: 15px; border-radius: 8px; animation: pulse 1.5s infinite; }
    .sk-line { height: 16px; background: #2a3a4a; margin-bottom: 8px; border-radius: 4px; animation: pulse 1.5s infinite; }
    .sk-line.short { width: 60%; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    .empty-state { text-align: center; padding: 50px; color: var(--border-color); }
    .empty-state i { font-size: 3rem; margin-bottom: 15px; display: block; }
    .queue-count { background: var(--action-blue); padding: 2px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand"><i class="fas fa-shield-alt"></i> Kaeri Admin</div>
    <button class="refresh-btn" onclick="loadDashboard()"><i class="fas fa-sync"></i> Refresh</button>
  </div>

  <div class="container">
    <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-weight: 500;">Verification Queue</span>
      <span class="queue-count" id="count">0</span>
    </div>

    <div id="loader" class="grid">
      <div class="skeleton-card"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div></div>
      <div class="skeleton-card"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div></div>
      <div class="skeleton-card"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div></div>
    </div>

    <div id="grid" class="grid" style="display: none;"></div>

    <div id="empty" class="empty-state" style="display: none;">
      <i class="fas fa-check-circle"></i>
      <p>All caught up! No pending payments.</p>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // CONFIG – Your live production API URL (UPDATED)
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      const API_URL = 'https://script.google.com/macros/s/AKfycbxMKcD2omQSPbJDiBrbsr7UGzdCyOzdPb53MXqJrXhWylIRguzgC5nsdjLroc855ewRSg/exec';

      let isProcessing = false;

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // API CALLER (with retry & timeout)
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function callApi(action, payload = {}, retries = 2) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 30000);

        return fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, ...payload }),
          signal: controller.signal
        })
        .then(res => {
          clearTimeout(timeout);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .catch(err => {
          clearTimeout(timeout);
          if (retries > 0) {
            return new Promise(resolve => setTimeout(resolve, 1000))
              .then(() => callApi(action, payload, retries - 1));
          }
          throw err;
        });
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // NOTIFICATION (SweetAlert wrapper)
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function showAlert(icon, title, text) {
        return Swal.fire({
          icon,
          title,
          text,
          background: '#1b263b',
          color: '#e0e6ed',
          confirmButtonColor: '#007bff',
          confirmButtonText: 'OK',
          backdrop: 'rgba(13,27,42,0.85)'
        });
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // LOAD DASHBOARD
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      window.loadDashboard = function() {
        const loader = document.getElementById('loader');
        const grid = document.getElementById('grid');
        const empty = document.getElementById('empty');

        loader.style.display = 'grid';
        grid.style.display = 'none';
        empty.style.display = 'none';

        callApi('getPendingVerifications')
          .then(res => {
            if (!res.success) {
              throw new Error(res.message || 'Failed to fetch queue');
            }
            render(res.data || []);
          })
          .catch(err => {
            console.error('[LOAD ERROR]', err.message);
            render([]);
            showAlert('error', 'Connection Error', 'Could not load the verification queue. Please refresh.');
          });
      };

      function render(data) {
        const loader = document.getElementById('loader');
        const grid = document.getElementById('grid');
        const empty = document.getElementById('empty');
        const count = document.getElementById('count');

        loader.style.display = 'none';
        count.innerText = data.length;

        if (data.length === 0) {
          empty.style.display = 'block';
          grid.style.display = 'none';
          return;
        }

        empty.style.display = 'none';
        grid.style.display = 'grid';
        grid.innerHTML = '';

        data.forEach(item => {
          const thumb = item.proofThumb || 'https://via.placeholder.com/400x200/0d1b2a/72efdd?text=No+Proof';
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <a href="${item.proofUrl || '#'}" target="_blank" rel="noopener">
              <img src="${thumb}" class="proof-img" alt="Payment Proof">
            </a>
            <div class="card-body">
              <div class="card-title">${escapeHtml(item.course)} ${escapeHtml(item.term)}</div>
              <div class="info-row"><span class="info-label">Name:</span> ${escapeHtml(item.studentName)}</div>
              <div class="info-row"><span class="info-label">Ref:</span> ${escapeHtml(item.transRef)}</div>
              <div class="info-row"><span class="info-label">Amt:</span> K${item.amount}</div>
              <div class="actions">
                <button class="btn btn-reject" data-row="${item.rowIndex}">Reject</button>
                <button class="btn btn-approve" data-row="${item.rowIndex}" data-course="${escapeHtml(item.course)}">Approve</button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

        // Attach event listeners
        document.querySelectorAll('.btn-approve').forEach(btn => {
          btn.addEventListener('click', function() {
            const rowIndex = parseInt(this.dataset.row);
            const course = this.dataset.course;
            handleApprove(rowIndex, course);
          });
        });

        document.querySelectorAll('.btn-reject').forEach(btn => {
          btn.addEventListener('click', function() {
            const rowIndex = parseInt(this.dataset.row);
            handleReject(rowIndex);
          });
        });
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // APPROVE
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function handleApprove(rowIndex, course) {
        if (isProcessing) return;

        Swal.fire({
          title: 'Approve?',
          text: `Approve ${course}?`,
          icon: 'question',
          showCancelButton: true,
          confirmButtonColor: '#28a745',
          cancelButtonColor: '#6c757d',
          background: '#1b263b',
          color: '#e0e6ed',
          confirmButtonText: 'Yes, Approve',
          cancelButtonText: 'Cancel'
        }).then(result => {
          if (result.isConfirmed) {
            setButtonsDisabled(true);
            isProcessing = true;

            callApi('processAdminVerification', {
              rowIndex: rowIndex,
              decision: 'APPROVE',
              notes: 'Verified'
            }, 2)
            .then(res => {
              if (res.success) {
                showAlert('success', 'Approved!', res.message || 'Code delivered successfully.')
                  .then(() => loadDashboard());
              } else {
                showAlert('error', 'Error', res.message || 'Approval failed.');
              }
            })
            .catch(() => {
              showAlert('error', 'Network Error', 'Could not reach the server. Please try again.');
            })
            .finally(() => {
              isProcessing = false;
              setButtonsDisabled(false);
            });
          }
        });
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // REJECT
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function handleReject(rowIndex) {
        if (isProcessing) return;

        Swal.fire({
          title: 'Reject Payment',
          input: 'text',
          inputLabel: 'Reason for rejection',
          inputPlaceholder: 'e.g. Blurry screenshot, wrong amount, etc.',
          showCancelButton: true,
          confirmButtonColor: '#dc3545',
          cancelButtonColor: '#6c757d',
          background: '#1b263b',
          color: '#e0e6ed',
          confirmButtonText: 'Reject',
          cancelButtonText: 'Cancel',
          inputValidator: (value) => {
            if (!value || value.trim() === '') {
              return 'Please enter a reason for rejection';
            }
            return null;
          }
        }).then(result => {
          if (result.isConfirmed && result.value) {
            setButtonsDisabled(true);
            isProcessing = true;

            callApi('processAdminVerification', {
              rowIndex: rowIndex,
              decision: 'REJECT',
              notes: result.value.trim()
            }, 2)
            .then(res => {
              if (res.success) {
                showAlert('success', 'Rejected!', res.message || 'Rejection recorded.')
                  .then(() => loadDashboard());
              } else {
                showAlert('error', 'Error', res.message || 'Rejection failed.');
              }
            })
            .catch(() => {
              showAlert('error', 'Network Error', 'Could not reach the server. Please try again.');
            })
            .finally(() => {
              isProcessing = false;
              setButtonsDisabled(false);
            });
          }
        });
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // UTILITY: Enable/disable all action buttons
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function setButtonsDisabled(disabled) {
        document.querySelectorAll('.btn-approve, .btn-reject').forEach(btn => {
          btn.disabled = disabled;
        });
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // UTILITY: escapeHtml (XSS prevention)
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // INIT – Auto-load on page load
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      document.addEventListener('DOMContentLoaded', function() {
        loadDashboard();
        // Expose globally for inline onclick
        window.loadDashboard = loadDashboard;
      });

    })();
  </script>
</body>
</html>
